[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ifscube"
authors = [
    {name="Daniel Ruschel Dutra", email="daniel.ruschel@ufsc.br"}
]
version = "1.4"
requires-python = ">=3.14"
dependencies = [
    "numpy",
    "astropy",
    "matplotlib",
    "numba>=0.65",
    "llvmlite>=0.47",
    "tqdm",
    "scipy",
    "h5py>=3.15.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ifscube"]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
]

[project.scripts]
specfit = "ifscube.fitter:specfit"
cubefit = "ifscube.fitter:cubefit"
fit_rotation = "ifscube.rotation:main"
fit_scrutinizer = "ifscube.fit_scrutinizer:main"

[project.optional-dependencies]
docs = [
    "sphinx>=9.1.0",
    "sphinx-rtd-theme>=3.1.0",
]
